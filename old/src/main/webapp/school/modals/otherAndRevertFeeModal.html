
<!-- Add a new other fee for a student-->

<div id="otherTermFeeModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="otherTermFeeTiltle">Add a new other Term Fee</h4>
			</div>

			<form method="post" action="#" id="otherTermFeeForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">


						<div class="col-md-8 col-md-offset-2">
								<br> <label for="classId">Other Fee:</label> <select
									class="form-control formelement cards otherFeeList" id="otherFeeId" name="otherFeeId" required>
									
								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="edit_otherterm">Term:</label> <select
									class="form-control formelement cards" id="edit_otherterm" name="term" required>
									<option>1</option>
									<option>2</option>

									<option>3</option>
								</select>
							</div>



							


							<input type="hidden" name="studentId" id="other_studentId" value="">

							<input type="hidden" name="accountId" class="accountId"
								value="n0t_set">









						</div>

						<!-- 	<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set"> -->





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" onclick="addOtherFee()"
						class="btn btn-info pull-right cards" id="othertermFee_btn">
						Submit <i class="fa fa-save"></i>
					</button>

					<!-- 	
					<button type="submit" onclick="updateStreamApiCall()" class="btn btn-info pull-right" id="stream_btn_update">
						Save Changes <i class="fa fa-save"></i>
					</button> -->


					<button type="button" class="btn btn-default pull-left cards"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
