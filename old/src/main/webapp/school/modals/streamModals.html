<!-- Add a new/edit stream -->

<div id="stream" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="streamTiltle">Add a new Stream</h4>
			</div>

			<form method="post" action="#" id="streamForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">



							<div class="col-md-8 col-md-offset-2" id="classDiv">
								<br> <label for="classId">Class/Form:</label> <select
									class="form-control formelement" onchange="fetchStreams()" name="classId" id="classId">

									<option value="">Form 1</option>

									<option value="">Form 2</option>
									<option value="">Form 3</option>

									<option value="">Form 4</option>


								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <br> <label for="desc">Stream Name</label> <input
									type="text" id="desc" name="desc"
									class="form-control formelement" placeholder="Description"
									pattern="[a-zA-Z0-9\s]{3,30}"
									title="Stream Name,Only characters are allowed and should be more than three and less than 30 characters "
									required> <br>
							</div>









						</div>

						<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set">





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="submit" class="btn btn-info pull-right" id="stream_btn">
						Submit <i class="fa fa-save"></i>
					</button>
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
