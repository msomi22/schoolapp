<!DOCTYPE html>
<html>
<head>
	<title>JS API TEST</title>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
</head>
<body>


<h1>JS API TEST</h1>



<script>
$(document).ready(function(){

    $("button").click(function(){

    	var account = 'E3CDC578-37BA-4CDB-B150-DAB0409270CD';
	    var cat = '55DD5463-6ECB-48A3-B6E7-03548A9E37FE';
	    var url = 'http://localhost:8080/school/webapi/config/scale/cat/'+account+'/'+cat;
	    var auth = 'Basic ' + btoa('demo:12345678');

	    $.ajax({
        type: 'GET',
        url: url,
        contentType : 'application/json',
	    accept : 'application/json',
        dataType: 'json',
        /*success: function(data) {
            console.log(data); 
        },*/
       beforeSend : function(req) {
            req.setRequestHeader('Authorization', auth);  
        }
     }).done(function (data){

     		console.log(data);

     }).fail(function(jqXHR, textStatus) {

			// alert("Error: " + textStatus);
			console.log(textStatus);

		})

	    
	  
        
    });


});
</script>



<button>Send an HTTP GET request</button>




</body>
</html>
