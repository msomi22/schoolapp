
<div id="changePasswordModal" class="modal modal-info fade"
	role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="changePasswordTiltle">Update
					Password</h4>
			</div>

			<form method="post" action="#" id="changePasswordForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row" id="changePasswordDiv">

							<div class="col-md-8 col-md-offset-2">
								<label for="password">Current Password</label>

								<div class="input-group">
									<span class="input-group-addon"><i
										class="glyphicon glyphicon-lock"></i></span> <input type="password"
										id="password" class="form-control formelement cards"
										name="password" placeholder="Current Password"
										pattern="[A-Za-z0-9\s]{6,20}" maxlength="20"
										title="Password, Alpha numeric characters are allowed and should be more than six characters"
										required>
								</div>


							</div>


							<div class="col-md-8 col-md-offset-2">
								<label for="password">Password</label>

								<div class="input-group">
									<span class="input-group-addon"><i
										class="glyphicon glyphicon-lock"></i></span> <input type="password"
										id="password" class="form-control formelement cards"
										name="password" placeholder="Password"
										pattern="[A-Za-z0-9\s]{6,20}" maxlength="20"
										title="Password, Alpha numeric characters are allowed and should be more than six characters"
										required>
								</div>


							</div>

							<div class="col-md-8 col-md-offset-2">
								<label for="password">Confirm Password</label>

								<div class="input-group">
									<span class="input-group-addon"><i
										class="glyphicon glyphicon-lock"></i></span> <input type="password"
										id="password" class="form-control formelement cards"
										name="password" placeholder="Confirm Password"
										pattern="[A-Za-z0-9\s]{6,20}" maxlength="20"
										title="Password, Alpha numeric characters are allowed and should be more than six characters"
										required>
								</div>


							</div>




						</div>









					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<!-- 	<button type="submit" style="display:none" onclick="addNewStream()" class="btn btn-info pull-right" id="stream_btn_add">
						Submit <i class="fa fa-save"></i>
					</button> -->




					<button type="button" onclick="updatePassword()"
						class="btn btn-info pull-right cards" id="password_btn">
						Change Password <i class="fa fa-save"></i>
					</button>


					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
