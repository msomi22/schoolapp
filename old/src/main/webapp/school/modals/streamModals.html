<!-- Add a new/edit stream -->

<div id="addStreamModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="streamTiltle">Add a new Stream</h4>
			</div>

			<form method="post" action="#" id="addStreamForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">



							<div class="col-md-8 col-md-offset-2" id="classDiv">
								<br> <label for="classId">Class/Form:</label> <select
									class="form-control formelement populateOptions classId"  name="classRoomId"  id="classId_add">

									<option value="">Form 1</option>

									<option value="">Form 2</option>
									<option value="">Form 3</option>

									<option value="">Form 4</option>


								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <br> <label for="desc">Stream Name</label> <input
									type="text" id="desc_add" name="description"
									class="form-control formelement" placeholder="Description"
									pattern="[a-zA-Z0-9\s]{3,30}"
									title="Stream Name,Only characters are allowed and should be more than three and less than 30 characters "
									required> <br>
							</div>
							
							
							<input type="hidden" name="uuid" id="uuid_add"
								value="n0t_set">
								
								<input type="hidden" name="accountId" id="accountId_add"
								value="n0t_set">









						</div>

					<!-- 	<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set"> -->





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" onclick="addNewStream()" class="btn btn-info pull-right" id="stream_btn_add">
						Submit <i class="fa fa-save"></i>
					</button>
					
				<!-- 	
					<button type="submit" onclick="updateStreamApiCall()" class="btn btn-info pull-right" id="stream_btn_update">
						Save Changes <i class="fa fa-save"></i>
					</button> -->
					
					
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>




<div id="updateStreamModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="streamTiltle">Edit Stream Details</h4>
			</div>

			<form method="post" action="#" id="editStreamForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">



							<div class="col-md-8 col-md-offset-2" id="classDiv">
								<br> <label for="classId">Class/Form:</label> <select
									class="form-control formelement populateOptions classId"  name="classRoomId" id="classId_edit">

									<option value="">Form 1</option>

									<option value="">Form 2</option>
									<option value="">Form 3</option>

									<option value="">Form 4</option>


								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <br> <label for="desc">Stream Name</label> <input
									type="text" id="desc" name="description"
									class="form-control formelement" placeholder="Description"
									pattern="[a-zA-Z0-9\s]{3,30}"
									title="Stream Name,Only characters are allowed and should be more than three and less than 30 characters "
									required> <br>
							</div>
							
							
							<input type="hidden" name="uuid" id="uuid"
								value="n0t_set">
								
								<input type="hidden" name="accountId" id="accountId"
								value="n0t_set">









						</div>

						<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set">





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
				<!-- 	<button type="submit" style="display:none" onclick="addNewStream()" class="btn btn-info pull-right" id="stream_btn_add">
						Submit <i class="fa fa-save"></i>
					</button> -->
					
					
					
					
					<button type="submit" onclick="updateStreamApiCall()" class="btn btn-info pull-right" id="stream_btn_update">
						Save Changes <i class="fa fa-save"></i>
					</button>
					
					
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>




<!--Del Modal -->
<div id="del_modal" class="modal modal-warning fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-danger">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="delTitle"></h4>
      </div>
      
     
      <div class="modal-body">
      
     
        <p id="delSms"></p>
        <form action="" method="post" id="delStream">
        
        <input type="hidden"  id="del_uuid" name="uuid"> 
        
        </form>
      </div>
      <div class="modal-footer">
       <input type="button" id="btn_delStream" class="btn btn-primary pull-right" onclick="delStreamApiCall()" value="OK" >
        <button type="button" class="btn btn-default pull-left" data-dismiss="modal">Close</button>
      </div>
     
    </div>

  </div>
</div>
