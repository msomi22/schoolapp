<!-- Add a new/edit term fee -->

<div id="gradingScaleModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="gradingScaleTiltle">Add a new Grade Scale </h4>
			</div>

			<form method="post" action="#" id="gradingScaleForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">


							<div class="col-md-8 col-md-offset-2">
								<br> <br> <label for="lowerLimit">Lower Limit:</label> <input
									type="text" id="lowerLimit" name="lowerLimit"
									class="form-control formelement cards" placeholder="Lower Limit"
									pattern="[0-9]{1,3}" maxlength="3"
									title="Lower Limit,Only digits e.g 10,70 e.t.c" required>
								
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="upperLimit">Upper Limit:</label> <input
									type="text" id="upperLimit" name="upperLimit"
									class="form-control formelement cards" placeholder="Upper Limit"
									pattern="[0-9]{1,3}" maxlength="3"
									title="Upper Limit,Only digits e.g 10,70 e.t.c" required>
								
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="description">Description:</label> <select
									class="form-control formelement cards" id="description" name="description" required>
									<option>A</option>
									<option>A-</option>
									<option>B+</option>
									<option>B</option>
									<option>B-</option>
									<option>C+</option>
									<option>C</option>
									<option>C-</option>
									<option>D+</option>
									<option>D</option>
									<option>D-</option>
									<option>E</option>
								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="points">Points:</label><select
									class="form-control formelement cards" id="points" name="points" required>
									<option>12</option>
									<option>11</option>
									<option>10</option>
									<option>9</option>
									<option>8</option>
									<option>7</option>
									<option>6</option>
									<option>5</option>
									<option>4</option>
									<option>3</option>
									<option>2</option>
									<option>1</option>
								</select>
							</div>


							<input type="hidden" name="uuid" id="cat_uuid" value="">

							<input type="hidden" name="categoryId"  id="categoryId"
								value="n0t_set">









						</div>

						<!-- 	<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set"> -->





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" onclick="addNewGradeScale()"
						class="btn btn-info pull-right cards" id="gradeScale_btn">
						Submit <i class="fa fa-save"></i>
					</button>

					<!-- 	
					<button type="submit" onclick="updateStreamApiCall()" class="btn btn-info pull-right" id="stream_btn_update">
						Save Changes <i class="fa fa-save"></i>
					</button> -->


					<button type="button" class="btn btn-default pull-left cards"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
