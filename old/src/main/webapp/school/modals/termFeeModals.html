<!-- Add a new/edit term fee -->

<div id="TermFeeModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="termFeeTiltle">Add a new Term Fee</h4>
			</div>

			<form method="post" action="#" id=TermFeeForm>
				<div class="modal-body">

					<div class="box-body">

						<div class="row">


							<div class="col-md-8 col-md-offset-2">
								<br> <br> <label for="boarder">Boarder Fee:</label> <input
									type="text" id="boarder" name="boaderAmount"
									class="form-control formelement cards" placeholder="Boarder Fee"
									pattern="[0-9]{3,5}" maxlength="5"
									title="Boarder Fee,Only digits e.g 1000,15000 e.t.c" required>
								
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="day">Day Fee:</label> <input
									type="text" id="day" name="dayAmount"
									class="form-control formelement cards" placeholder="Day Fee"
									pattern="[0-9]{3,5}" maxlength="5"
									title="Day Fee,Only digits e.g 1000,15000 e.t.c" required>
								
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="classId">Term:</label> <select
									class="form-control formelement cards" id="edit_term" name="term" required>
									<option>1</option>
									<option>2</option>

									<option>3</option>
								</select>
							</div>



							<div class="col-md-8 col-md-offset-2">
								<br> <label for="desc">Year:</label><input
									type="text"  name="year" id="edit_year"
									class="form-control formelement cards c_year yearConfig"
									placeholder="Enter the Year" pattern="[0-9]{4}" maxlength="4"
									title="Year, should contain numerics only and should be 4 numbers only"
									required> <br>
							</div>


							<input type="hidden" name="uuid" id="term_uuid" value="">

							<input type="hidden" name="accountId" id="term_accountId"
								value="n0t_set">









						</div>

						<!-- 	<input type="hidden" name="" id="" value="not_set"> <input
							type="hidden" name="" id="" value="not_set"> -->





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" onclick="addNewTermFee()"
						class="btn btn-info pull-right" id="termFee_btn">
						Submit <i class="fa fa-save"></i>
					</button>

					<!-- 	
					<button type="submit" onclick="updateStreamApiCall()" class="btn btn-info pull-right" id="stream_btn_update">
						Save Changes <i class="fa fa-save"></i>
					</button> -->


					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
