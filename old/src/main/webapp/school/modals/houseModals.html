<!-- Add a new/edit exam -->

<div id="houseModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="houseTiltle">Add a new House</h4>
			</div>

			<form method="post" action="#" id="houseForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">
							<div class="col-md-8 col-md-offset-2">
								<label for="hsename">Name:</label>

								<input type="text" id="hsename" class="form-control formelement"
									name="houseName"  placeholder="House Name" pattern="[a-zA-Z0-9\s]{2,15}" maxlength="15"
									title="House Name,Only alphanumeric characters are allowed and should be more than one and less than 15 characters"
									required>
							</div>

							<div class="col-md-8 col-md-offset-2">
								<label for="dname">Description</label>
								<input type="text" id="dname" name="description"
									class="form-control formelement" placeholder="Description" maxlength="15"
									pattern="[a-zA-Z0-9\s]{3,30}"
									title="Description,Only characters are allowed and should be more than three and less than 30 characters "
									required>
							</div>



							

							


						</div>

						<input type="hidden" name="uuid" id="uuid" value="not_set"> 
						
						<input
							type="hidden" name="accountId" id="hse_accountId" value="not_set">





					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-info pull-right cards" id="house_btn" onclick="addHouse(this.form)">
						Submit  <i class="fa fa-save"></i>
					</button>
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>
