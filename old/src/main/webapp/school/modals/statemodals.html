<!-- Number of exams modal-->
<div id="examWarning" class="modal  fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-warning">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="titleWarning">Number of exams allowed</h4>
      </div>
      <div class="modal-body ">
        <p id="smsWarning">At least one exam and not more than three exams are allowed.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>

  </div>
</div>




<div id="scorewarning" class="modal modal-warning  fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-warning">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title">Score Invalid</h4>
      </div>
      <div class="modal-body ">
        <p>The score should be no more than 2 numerics i.e 06,56,23 e.tc.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>

  </div>
</div>


<div id="warning" class="modal modal-warning  fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-warning">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="warningTitle">##</h4>
      </div>
      <div class="modal-body ">
        <p id="warningSms">####</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>

  </div>
</div>

<div id="success" class="modal modal-success  fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-success">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="successTitle">Student's Record</h4>
      </div>
      <div class="modal-body ">
        <p>Record successfully added.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>

  </div>
</div>



<div id="error" class="modal modal-danger  fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-danger">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="errorTitle">Student's Record Error</h4>
      </div>
      <div class="modal-body " id="errorSms">
        <p>An error occurred, the record already exists.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="modal">Ok</button>
      </div>
    </div>

  </div>
</div>




<!--Disable Modal -->
<div id="Dis_modal" class="modal modal-warning fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-warning">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="disableTitle"></h4>
      </div>
      
      <form action="#" method="post">
      <div class="modal-body">
      <input type="hidden" name="delPro_catId" id="delPro_catId" value="not_set" >
      <input type="hidden" name="delPro_portId" id="delPro_portId" value="not_set" >
     
        <p id="disableSms"></p>
      </div>
      <div class="modal-footer">
       <input type="submit" class="btn btn-primary pull-right" value="OK" >
        <button type="button" class="btn btn-default pull-left" data-dismiss="modal">Close</button>
      </div>
       </form>
    </div>

  </div>
</div>
