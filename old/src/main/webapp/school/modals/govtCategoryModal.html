<!-- Add a new/edit govt category -->

<div id="govtCategoryModal" class="modal modal-info fade" role="dialog">
	<div class="modal-dialog">

		<!-- Modal content-->
		<div class="modal-content alert alert-info">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal">&times;</button>
				<h4 class="modal-title" id="govtCatTiltle">Add a new Govt Fund
					Category</h4>
			</div>

			<form method="post" action="#" id="govtCatForm">
				<div class="modal-body">

					<div class="box-body">

						<div class="row">
							<div class="col-md-2 col-md-offset-2">
								<label for="catname">Name</label>


							</div>

							<div class="col-md-4">
								<input type="text" id="catname" class="form-control formelement"
									name="feeDescription" placeholder="Category Name"
									maxlength="20"
									title="Category name,Only characters are allowed and should be more than three and less than 30characters"
									required>
							</div>

						</div>

						<div class="row">

							<br>


							<div class="col-md-2 col-md-offset-2">
								<label for="amount">Amount</label>
							</div>

							<div class="col-md-4">
								<input type="text" id="amount" name="amount"
									class="form-control formelement" placeholder="Catergoty Amount"
									pattern="[0-9]{3,5}" maxlength="5"
									title="Amount,Only numbers are allowed and should be more than two and less than five digits e.g 500,2000 e.t.c "
									required>
							</div>

						</div>








						<input type="hidden" name="uuid" id="uuid" value="not_set">

						<input type="hidden" name="accountId" id="accountId"
							value="not_set"> <input type="hidden"
							name="feeBreakdownId" id="feeBreakdownId" value="not_set">
							
						<!-- 	<input type="hidden" name="code" id="code" value="111"> -->

						<input type="hidden" name="feeCode" id="feeCode">









					</div>
					<!-- /.box-body -->



				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-info pull-right"
						id="govtCatbtn" onclick="addGovtCategory()">
						Submit <i class="fa fa-save"></i>
					</button>
					<button type="button" class="btn btn-default pull-left"
						data-dismiss="modal">Close</button>
				</div>

			</form>
		</div>

	</div>
</div>


<!--Del Modal -->
<div id="del_modal" class="modal modal-warning fade" role="dialog">
  <div class="modal-dialog">

    <!-- Modal content-->
    <div class="modal-content alert alert-danger">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal">&times;</button>
        <h4 class="modal-title" id="delTitle">Delete Govt Fund Category</h4>
      </div>
      
     
      <div class="modal-body">
      
     
        <p id="delSms">Are you sure, you want to delete this category?</p>
        <form action="" method="post" id="delGovtCat">
        
        <input type="hidden"  id="del_uuid" name="uuid"> 
        
        </form>
      </div>
      <div class="modal-footer">
       <input type="button" id="btn_delStream" class="btn btn-primary pull-right" onclick="delGovtCat()" value="OK" >
        <button type="button" class="btn btn-default pull-left" data-dismiss="modal">Close</button>
      </div>
     
    </div>

  </div>
</div>
